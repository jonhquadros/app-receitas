# Supabase Edge Function configuration
# Stripe sends webhooks without a Supabase user JWT.
[functions.stripe-webhook]
verify_jwt = false

[functions.create-checkout-session]
verify_jwt = true

[functions.create-customer-portal]
verify_jwt = true

# This function validates the authenticated user's Checkout Session
# inside the handler, so the deployed function can accept the browser request.
[functions.verify-checkout-session]
verify_jwt = false
