name: Security and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=auto supabase/functions/create-checkout-session/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/create-customer-portal/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/stripe-webhook/index.ts
